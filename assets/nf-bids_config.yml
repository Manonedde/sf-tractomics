loop_over: [subject, session, run]

T1w:
  sequential_set:
    by_entity: "run"

dwi:
  sequential_set:
    by_entity: "run"
    additional_extensions: ["bval", "bvec"]
  exclude_entities: ["dir"]

dwi_full:
  suffix_maps_to: "dwi"
  mixed_set:
    named_dimension: direction
    sequential_dimension: run
    named_groups:
      pa:
        direction: dir-PA
      ap:
        direction: dir-AP

epi:
  sequential_set:
    by_entity: "run"
  exclude_entities: ["dir"]

epi_full:
  suffix_maps_to: "epi"
  mixed_set:
    named_dimension: direction
    sequential_dimension: run
    named_groups:
      pa:
        direction: dir-PA
      ap:
        direction: dir-AP

sbref:
  sequential_set:
    by_entity: "run"
  exclude_entities: ["dir"]

sbref_full:
  suffix_maps_to: "sbref"
  mixed_set:
    named_dimension: direction
    sequential_dimension: run
    named_groups:
      pa:
        direction: dir-PA
      ap:
        direction: dir-AP

# nf-bids only understands BIDS entities + suffix: it has no filename or
# derivatives filter, and "lesion" in "*_lesion_mask.nii.gz" is not an entity.
# So every *_mask file of a subject/session lands here (brain masks included),
# and the pipeline keeps only derivatives/**/*_lesion_mask.nii.gz
# (see PIPELINE_INITIALISATION).
lesion_mask:
  suffix_maps_to: "mask"
  sequential_set:
    by_entity: "run"

# FLAIR used by LST-AI when no lesion mask was found. Only raw (non-derivatives)
# files are kept by the pipeline.
lesion_candidate_flair:
  suffix_maps_to: "FLAIR"
  sequential_set:
    by_entity: "run"
